name: Greeting on variable day

on:
  workflow_dispatch

env:
  DAY_OF_WEEK: Monday
  First_Name: lee
  Greeting: Hello
  API_BASE: ${{ vars.API_BASE }}
  KEY: ${{vars.KEY}}
jobs:
  greeting_job:
    runs-on: ubuntu-latest
    steps:
      - name: "Say Hello Mona it's Monday"
        run: echo "$Greeting $First_Name. Today is $DAY_OF_WEEK!, $API_BASE, $KEY"
